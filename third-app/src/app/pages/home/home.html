<section>
  <div class="container">
    <h1 class="text-center">Home Page</h1>

    <div class="justify-center">
      <button (click)="goToContact()" class="btn">Go to Contact</button>

      <button (click)="goToRegister()" class="btn">Check Register Redirection</button>

      <br /><br />
    </div>

    <hr />
    <h4 class="text-center">Query Params</h4>
    <div class="m-3 justify-center">
      <button (click)="navQuery()" class="btn">Navigate Query Params</button>
      <a class="btn" routerLink="/profile" [queryParams]="{ id: 1, name: 'Darsh', age: 25 }"
        >Check Rohan Profile</a
      >
    </div>

    <hr />
    <h4 class="text-center">Routing Params</h4>
    <div class="m-3 justify-center">
      <a routerLink="/about/anil" class="btn">About Anil Params</a>
      <a [routerLink]="['/about', 'Mukul', 56]" class="btn">About Mukul Params</a>

      <button (click)="navigateRouteParams()" class="btn">Navigate Route Params</button>
    </div>

    <hr />
    <!-- <h4 class="text-center">Dynamic Routing</h4> -->

    <!-- <app-users></app-users> -->
  </div>
</section>
