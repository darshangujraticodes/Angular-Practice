<section>
  <div class="container">
    <h4 class="text-center">Dynamic Routing</h4>

    <div>
      <ul>
        @for (user of userList(); track user.id) {
          <li>
            <a [routerLink]="['/user-details', user.id]">
              {{ user.name }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
