<header>
  <div class="container-fluid">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a
                class="nav-link active"
                routerLink="/"
                [routerLinkActiveOptions]="{ exact: true }"
                routerLinkActive="active"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/contact" routerLinkActive="active">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/todo-project" routerLinkActive="active"
                >Todo Project</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" routerLink="/parent" routerLinkActive="active">Parent</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/reactive-form" routerLinkActive="active"
                >Reactive Form</a
              >
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" routerLink="/api-crud" routerLinkActive="active">API</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>
</header>
